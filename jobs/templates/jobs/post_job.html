<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post an AI Job</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <header class="bg-white border-b border-gray-200 py-6">
        <div class="max-w-2xl mx-auto px-4">
            <a href="{% url 'home' %}" class="text-indigo-600 font-bold">← Back to Job Board</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-10">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-2xl font-bold mb-2">Post a Job Listing</h2>
            <p class="text-gray-500 mb-6 text-sm">Reach thousands of AI automation developers. Standard posts are free (require manual review). Premium featured posts cost $10.</p>

            <form method="POST" class="space-y-5">
                {% csrf_token %}
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Job Title</label>
                    <input type="text" name="title" required placeholder="e.g. Lead Make.com / OpenAI Automation Engineer" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Company Name</label>
                        <input type="text" name="company_name" required placeholder="e.g. Acme Agency" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Company Website</label>
                        <input type="url" name="company_website" placeholder="https://example.com" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Application URL or Email</label>
                    <input type="url" name="apply_url" required placeholder="https://jobs.lever.co/... or mailto:hr@..." class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-hidden">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Job Description</label>
                    <textarea name="description" rows="5" required placeholder="Describe the role, responsibilities, and specific tech stack requirements (Zapier, LangChain, Python, etc.)" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"></textarea>
                </div>

                <div class="p-4 bg-indigo-50 rounded-lg border border-indigo-100 flex items-start gap-3">
                    <input type="checkbox" name="upgrade_featured" id="upgrade" class="mt-1 h-4 w-4 text-indigo-600 border-gray-300 rounded-sm focus:ring-indigo-500">
                    <label for="upgrade" class="text-sm">
                        <span class="font-bold text-indigo-900 block">✨ Upgrade to Featured Post (+$10)</span>
                        <span class="text-indigo-700 text-xs">Pin your post to the absolute top of the board highlighted in gold for maximum visibility.</span>
                    </label>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg text-sm transition">
                    Submit Job Listing
                </button>
            </form>
        </div>
    </main>

</body>
</html>
