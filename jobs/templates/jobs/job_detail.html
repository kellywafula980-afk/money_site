{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h1>{{ job.title }}</h1>
    <h3>{{ job.company_name }}</h3>
    <p><strong>Location:</strong> {{ job.location }}</p>
    <p><strong>Salary:</strong> {{ job.salary_range|default:"Not specified" }}</p>
    <div class="mt-4">
        <h4>Job Description</h4>
        <p>{{ job.description|linebreaks }}</p>
    </div>
    <a href="{{ job.apply_url }}" target="_blank" class="btn btn-primary mt-3">Apply Now</a>
</div>
{% endblock %}
