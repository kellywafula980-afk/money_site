{% extends "base.html" %}

{% block title %}Post a Job - GlobalGigs{% endblock %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-black text-white tracking-tight">Post a Job</h1>
    <p class="text-zinc-400 mt-1">Reach thousands of qualified candidates</p>
</div>

<div class="bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-6 md:p-8">
    <form method="POST">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="mb-6 p-4 bg-red-950/30 border border-red-800 rounded-xl text-red-400 text-sm">
                <strong>Please fix the following errors:</strong>
                {{ form.errors }}
            </div>
        {% endif %}
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Job Title *</label>
                <input type="text" name="title" class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500 transition" placeholder="Senior Python Developer" required>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Company Name *</label>
                <input type="text" name="company_name" class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500 transition" placeholder="Google" required>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Location *</label>
                <input type="text" name="location" class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500 transition" placeholder="Remote (US), Nairobi, Kenya" required>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Description *</label>
                <textarea name="description" class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500 transition" rows="5" placeholder="Describe the role, responsibilities, and requirements..." required></textarea>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Salary Range</label>
                <input type="text" name="salary_range" class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500 transition" placeholder="$80k - $120k, KES 100k - 200k">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">Application URL</label>
                <input type="url" name="apply_url" class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500 transition" placeholder="https://example.com/apply">
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-1">Employment Type</label>
                    <select name="employment_type" class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:border-emerald-500 transition">
                        <option value="">Select...</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Contract">Contract</option>
                        <option value="Freelance">Freelance</option>
                        <option value="Internship">Internship</option>
                        <option value="Remote">Remote</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-300 mb-1">Experience Level</label>
                    <select name="experience_level" class="w-full px-4 py-3 bg-zinc-800/50 border border-zinc-700 rounded-xl text-white focus:outline-none focus:border-emerald-500 transition">
                        <option value="">Select...</option>
                        <option value="Entry Level">Entry Level</option>
                        <option value="Mid-Level">Mid-Level</option>
                        <option value="Senior">Senior</option>
                        <option value="Lead">Lead</option>
                        <option value="Manager">Manager</option>
                        <option value="Director">Director</option>
                    </select>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-4">
                <label class="flex items-center gap-2 text-sm text-zinc-300">
                    <input type="checkbox" name="is_featured" class="w-4 h-4 bg-zinc-800 border-zinc-700 rounded focus:ring-emerald-500">
                    <span>Feature this job</span>
                </label>
                <label class="flex items-center gap-2 text-sm text-zinc-300">
                    <input type="checkbox" name="is_premium" class="w-4 h-4 bg-zinc-800 border-zinc-700 rounded focus:ring-emerald-500">
                    <span>Premium Listing</span>
                </label>
            </div>
            
            <div class="pt-4 border-t border-zinc-800/80">
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-emerald-500/20">
                    Post Job
                </button>
                <a href="{% url 'dashboard:home' %}" class="block text-center mt-3 text-sm text-zinc-500 hover:text-zinc-400 transition">
                    Cancel
                </a>
            </div>
        </div>
    </form>
</div>
{% endblock %}
