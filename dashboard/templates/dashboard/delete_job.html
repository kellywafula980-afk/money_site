{% extends "base.html" %}

{% block title %}Delete Job - GlobalGigs{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-custom">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">🗑️ Delete Job</h4>
                </div>
                <div class="card-body text-center">
                    <h5>Are you sure you want to delete this job?</h5>
                    <p class="text-muted">"{{ job.title }}" at {{ job.company_name }}</p>
                    <p class="text-danger"><small>This action cannot be undone.</small></p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">Yes, Delete</button>
                            <a href="{% url 'dashboard:my_jobs' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
